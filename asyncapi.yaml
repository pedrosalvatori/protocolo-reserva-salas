defaultContentType: application/json

servers:
  servidor:
    host: '{ip}:{porta}'
    protocol: tcp
    title: Servidor de reservas
    summary: Servidor TCP multithread, uma thread por conexão de cliente.
    description: |
      IP e porta são digitados nas telas: o servidor informa a porta de escuta e o cliente
      informa o IP e a porta do servidor. Cada mensagem é um JSON UTF-8 em linha única terminado
      por `\n`, com no máximo 8192 bytes. Não existe binding oficial de TCP no AsyncAPI, então os
      parâmetros de transporte ficam na extensão `x-transporte`.
    variables:
      ip:
        description: IP do servidor, digitado no cliente.
        examples: ['127.0.0.1']
      porta:
        description: Porta de escuta, digitada no servidor e no cliente.
        examples: ['5000']
    x-transporte:
      codificacao: UTF-8
      delimitador: LF
      tamanho_maximo_bytes: 8192
      timeout_inatividade_s: 300
      validade_token_min: 30
      modelo: requisicao-resposta

channels:
  conexao:
    address: null
    title: Conexão TCP
    summary: Canal único. Todas as mensagens trafegam na mesma conexão TCP, uma por linha.
    description: |
      Não há rotas nem tópicos: é o campo `op` do JSON que identifica a operação.
      A correlação requisição ↔ resposta é **posicional**: a conexão é síncrona (uma resposta por
      requisição, na ordem) e a resposta repete a `op` com o sufixo `_response`.
    servers:
      - $ref: '#/servers/servidor'
    messages:
      register: {$ref: '#/components/messages/register'}
      register_response: {$ref: '#/components/messages/register_response'}
      login: {$ref: '#/components/messages/login'}
      login_response: {$ref: '#/components/messages/login_response'}
      logout: {$ref: '#/components/messages/logout'}
      logout_response: {$ref: '#/components/messages/logout_response'}
      read_user: {$ref: '#/components/messages/read_user'}
      read_user_response: {$ref: '#/components/messages/read_user_response'}
      update_user: {$ref: '#/components/messages/update_user'}
      update_user_response: {$ref: '#/components/messages/update_user_response'}
      delete_user: {$ref: '#/components/messages/delete_user'}
      delete_user_response: {$ref: '#/components/messages/delete_user_response'}
      admin_list_users: {$ref: '#/components/messages/admin_list_users'}
      admin_list_users_response: {$ref: '#/components/messages/admin_list_users_response'}
      admin_read_user: {$ref: '#/components/messages/admin_read_user'}
      admin_read_user_response: {$ref: '#/components/messages/admin_read_user_response'}
      admin_update_user: {$ref: '#/components/messages/admin_update_user'}
      admin_update_user_response: {$ref: '#/components/messages/admin_update_user_response'}
      admin_delete_user: {$ref: '#/components/messages/admin_delete_user'}
      admin_delete_user_response: {$ref: '#/components/messages/admin_delete_user_response'}
      create_room: {$ref: '#/components/messages/create_room'}
      create_room_response: {$ref: '#/components/messages/create_room_response'}
      list_rooms: {$ref: '#/components/messages/list_rooms'}
      list_rooms_response: {$ref: '#/components/messages/list_rooms_response'}
      read_room: {$ref: '#/components/messages/read_room'}
      read_room_response: {$ref: '#/components/messages/read_room_response'}
      update_room: {$ref: '#/components/messages/update_room'}
      update_room_response: {$ref: '#/components/messages/update_room_response'}
      delete_room: {$ref: '#/components/messages/delete_room'}
      delete_room_response: {$ref: '#/components/messages/delete_room_response'}
      check_availability: {$ref: '#/components/messages/check_availability'}
      check_availability_response: {$ref: '#/components/messages/check_availability_response'}
      create_reservation: {$ref: '#/components/messages/create_reservation'}
      create_reservation_response: {$ref: '#/components/messages/create_reservation_response'}
      list_reservations: {$ref: '#/components/messages/list_reservations'}
      list_reservations_response: {$ref: '#/components/messages/list_reservations_response'}
      read_reservation: {$ref: '#/components/messages/read_reservation'}
      read_reservation_response: {$ref: '#/components/messages/read_reservation_response'}
      update_reservation: {$ref: '#/components/messages/update_reservation'}
      update_reservation_response: {$ref: '#/components/messages/update_reservation_response'}
      delete_reservation: {$ref: '#/components/messages/delete_reservation'}
      delete_reservation_response: {$ref: '#/components/messages/delete_reservation_response'}
      linha_invalida: {$ref: '#/components/messages/linha_invalida'}
      error: {$ref: '#/components/messages/error'}

operations:
  # ───────────────────────────── Autenticação ─────────────────────────────
  register:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: register
    x-acesso: publico
    summary: Cria uma conta. Não envia token.
    description: |
      - Valida `user`, `password` e `email` pelas regex do dicionário.
      - Todo cadastro nasce com `role` "user".
      - O cadastro **não** cria sessão: o cliente deve fazer `login` em seguida.
    tags: [{$ref: '#/components/tags/autenticacao'}]
    messages: [{$ref: '#/channels/conexao/messages/register'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/register_response'}]

  login:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: login
    x-acesso: publico
    summary: Autentica por email e senha e devolve token e role.
    description: |
      - Ordem obrigatória (v2.2, regra 3.12): formato (400) → credenciais (401) → sessão ativa (409).
      - Usuário inexistente e senha errada devolvem a **mesma** mensagem 401, para não revelar quais usuários existem.
        Por causa da ordem acima, o 409 só aparece com email e senha corretos.
      - Credenciais corretas e sem sessão ativa: o servidor gera e grava o token e devolve `token` e `role`.
        A checagem de sessão e a criação do token ficam na mesma seção crítica (v2.2, regra 3.11):
        com dois logins simultâneos, um recebe 200 e o outro 409.
      - Sessão ativa → 409 (fazer logout ou aguardar a expiração de 30 min).
    tags: [{$ref: '#/components/tags/autenticacao'}]
    messages: [{$ref: '#/channels/conexao/messages/login'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/login_response'}]

  logout:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: logout
    x-acesso: logado
    summary: Invalida o token da sessão.
    description: |
      - O servidor busca o token no banco e o invalida. Token já invalidado → 401.
      - O cliente só descarta o token ao receber o `logout_response` (200 ou 401) e então volta à tela de login (v2.2, regra 3.10).
      - Se a conexão tiver sido fechada por inatividade (300 s), o cliente reconecta e reenvia o logout (regra 1.11).
        Descartar o token sem resposta deixa a sessão ativa no servidor e bloqueia o login seguinte com 409.
    tags: [{$ref: '#/components/tags/autenticacao'}]
    messages: [{$ref: '#/channels/conexao/messages/logout'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/logout_response'}]

  # ─────────────────────────── Próprio cadastro ───────────────────────────
  read_user:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: read_user
    x-acesso: logado
    summary: Lê o próprio cadastro.
    description: |
      - Não há campo de usuário alvo: o autor vem do token. A senha nunca é devolvida.
      - Para ler o cadastro de outro usuário existe `admin_read_user`.
    tags: [{$ref: '#/components/tags/usuario'}]
    messages: [{$ref: '#/channels/conexao/messages/read_user'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/read_user_response'}]

  update_user:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: update_user
    x-acesso: logado
    summary: Altera o próprio user e/ou a própria senha.
    description: |
      - `""` é ignorado (não altera); `null` → 400.
      - O `email` **não** pode ser alterado (RNF 5.c): se a chave `email` vier na requisição → 400.
      - `user` e `password` vazios ao mesmo tempo → 400 "Nenhum dado para atualizar" (v2.4, regra 2.13).
      - Ao trocar o próprio `user`, o token continua válido.
    tags: [{$ref: '#/components/tags/usuario'}]
    messages: [{$ref: '#/channels/conexao/messages/update_user'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/update_user_response'}]

  delete_user:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: delete_user
    x-acesso: logado
    summary: Remove o próprio cadastro, confirmando com a senha.
    description: |
      - O alvo vem do token e a senha confirma a operação.
      - Senha incorreta → **403 "Senha incorreta"**: nada é removido e a sessão continua (v2.1, regra 3.9).
        Antes era 401, o que fazia o cliente descartar um token que o servidor mantinha ativo,
        e o login seguinte respondia 409 por até 30 min.
      - Com a senha certa, o servidor apaga o cadastro, invalida o token e apaga todas as reservas do usuário,
        passadas e futuras (v2.3, regra 3.13). O `user` e o `email` ficam livres para um novo `register`.
      - Remoção de outro usuário: `admin_delete_user`.
    tags: [{$ref: '#/components/tags/usuario'}]
    messages: [{$ref: '#/channels/conexao/messages/delete_user'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/delete_user_response'}]

  # ───────────────────────────── Administrador ────────────────────────────
  admin_list_users:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: admin_list_users
    x-acesso: admin
    summary: Lista todos os cadastros. Requer role admin.
    description: |
      - Nunca devolve senhas.
      - Lista vazia → 200 com `"count": "0"` e `"users": []`.
    tags: [{$ref: '#/components/tags/admin'}]
    messages: [{$ref: '#/channels/conexao/messages/admin_list_users'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/admin_list_users_response'}]

  admin_read_user:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: admin_read_user
    x-acesso: admin
    summary: Lê o cadastro de qualquer usuário. Requer role admin.
    description: |
      - `target_user` é sempre o alvo; o autor continua sendo identificado pelo token.
    tags: [{$ref: '#/components/tags/admin'}]
    messages: [{$ref: '#/channels/conexao/messages/admin_read_user'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/admin_read_user_response'}]

  admin_update_user:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: admin_update_user
    x-acesso: admin
    summary: Altera user, senha e/ou role de qualquer usuário. Requer role admin.
    description: |
      - Mesmas regras de `update_user` (`""` = não alterar; `email` proibido), e o admin também pode alterar `role`.
      - `user`, `password` e `role` vazios ao mesmo tempo → 400 "Nenhum dado para atualizar" (v2.4, regra 2.13).
      - Rebaixar o próprio role sendo o único admin → 403 "Nao e possivel remover o ultimo administrador".
    tags: [{$ref: '#/components/tags/admin'}]
    messages: [{$ref: '#/channels/conexao/messages/admin_update_user'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/admin_update_user_response'}]

  admin_delete_user:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: admin_delete_user
    x-acesso: admin
    summary: Remove qualquer usuário. Requer role admin.
    description: |
      - Remover o último administrador → 403 "Nao e possivel remover o ultimo administrador".
      - Apaga o cadastro, encerra a sessão do usuário removido e apaga todas as reservas dele, passadas e futuras
        (v2.3, regra 3.13). O `user` e o `email` ficam livres para um novo `register`.
    tags: [{$ref: '#/components/tags/admin'}]
    messages: [{$ref: '#/channels/conexao/messages/admin_delete_user'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/admin_delete_user_response'}]

  # ──────────────────────────────── Salas ─────────────────────────────────
  create_room:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: create_room
    x-acesso: admin
    summary: Cadastra uma sala. Requer role admin.
    description: |
      - `room_id` é gerado pelo servidor. A sala nasce com `"room_status": "active"`.
      - `resources` pode ser array vazio. Nome duplicado → 409.
    tags: [{$ref: '#/components/tags/salas'}]
    messages: [{$ref: '#/channels/conexao/messages/create_room'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/create_room_response'}]

  list_rooms:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: list_rooms
    x-acesso: logado
    summary: Lista salas, com filtros opcionais de horário e capacidade.
    description: |
      - Liberado para qualquer usuário logado. Os quatro filtros são **opcionais**.
      - Sem `date`/`start_time`/`end_time`: lista todas as salas e omite `available`.
      - Com o trio completo, cada sala vem com `available`. Enviar só parte do trio → 400.
      - Lista vazia → 200 com `"count": "0"`.
    tags: [{$ref: '#/components/tags/salas'}]
    messages: [{$ref: '#/channels/conexao/messages/list_rooms'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/list_rooms_response'}]

  read_room:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: read_room
    x-acesso: logado
    summary: Lê uma sala.
    description: |
      - Liberado para qualquer usuário logado.
      - A agenda da sala é obtida com `list_reservations` filtrando por `room_id`.
    tags: [{$ref: '#/components/tags/salas'}]
    messages: [{$ref: '#/channels/conexao/messages/read_room'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/read_room_response'}]

  update_room:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: update_room
    x-acesso: admin
    summary: Altera uma sala. Requer role admin.
    description: |
      - `""` é ignorado; `null` → 400. `room_id` nunca muda.
      - Reduzir `capacity` abaixo dos `participants` de uma reserva futura → 409.
      - `"room_status": "inactive"` bloqueia novas reservas, mas preserva as existentes.
      - ⚠ Pendências 3 e 5: sem `message` para o 409 de capacidade; sem forma de "não alterar" o array `resources`.
    tags: [{$ref: '#/components/tags/salas'}]
    messages: [{$ref: '#/channels/conexao/messages/update_room'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/update_room_response'}]

  delete_room:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: delete_room
    x-acesso: admin
    summary: Remove uma sala sem reservas futuras. Requer role admin.
    description: |
      - Sala com reservas futuras → 409.
      - Para tirar de circulação uma sala com agenda, use `update_room` com `"room_status": "inactive"`.
    tags: [{$ref: '#/components/tags/salas'}]
    messages: [{$ref: '#/channels/conexao/messages/delete_room'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/delete_room_response'}]

  # ─────────────────────────────── Reservas ───────────────────────────────
  check_availability:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: check_availability
    x-acesso: logado
    summary: Consulta informativa se a sala está livre no horário.
    description: |
      - **Não** reserva e não garante nada (regra 5.2).
      - Sala ocupada → 200 com `"available": "false"` (não é erro). Sala `inactive` → `"available": "false"`.
    tags: [{$ref: '#/components/tags/reservas'}]
    messages: [{$ref: '#/channels/conexao/messages/check_availability'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/check_availability_response'}]

  create_reservation:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: create_reservation
    x-acesso: logado
    summary: Reserva uma sala. Ponto crítico de concorrência.
    description: |
      - Verificação e gravação acontecem sob o **mesmo lock por `room_id`** (regra 5.1):
        com pedidos simultâneos, o primeiro recebe 201 e o segundo 409.
      - Respondem 400: `end_time <= start_time`, data passada e `participants > capacity`.
      - Sala `inactive` → 409 "Sala indisponivel para reserva".
    tags: [{$ref: '#/components/tags/reservas'}]
    messages: [{$ref: '#/channels/conexao/messages/create_reservation'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/create_reservation_response'}]

  list_reservations:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: list_reservations
    x-acesso: logado
    summary: Lista as minhas reservas ou todas (admin).
    description: |
      - `scope` aceita "mine" (padrão, se ausente) e "all". "all" só para admin; usuário comum → 403.
      - `date` e `room_id` são filtros opcionais. Lista vazia → 200 com `"count": "0"`.
    tags: [{$ref: '#/components/tags/reservas'}]
    messages: [{$ref: '#/channels/conexao/messages/list_reservations'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/list_reservations_response'}]

  read_reservation:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: read_reservation
    x-acesso: dono-ou-admin
    summary: Lê uma reserva.
    description: |
      - Usuário comum lê apenas as próprias reservas; reserva de terceiro → 403.
      - O admin lê qualquer reserva.
    tags: [{$ref: '#/components/tags/reservas'}]
    messages: [{$ref: '#/channels/conexao/messages/read_reservation'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/read_reservation_response'}]

  update_reservation:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: update_reservation
    x-acesso: dono
    summary: Altera horário, assunto ou participantes de uma reserva.
    description: |
      - `""` é ignorado; `null` → 400. Reserva de terceiro → 403.
      - `room_id` e `date` não mudam: para trocar de sala ou de dia, cancela-se e cria-se outra reserva.
      - Estender o horário passa pelo mesmo lock de `create_reservation`.
      - Reserva já encerrada → 409 "Reserva ja encerrada".
      - ⚠ Pendência 10: não está definido se o admin pode alterar reserva de terceiro.
    tags: [{$ref: '#/components/tags/reservas'}]
    messages: [{$ref: '#/channels/conexao/messages/update_reservation'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/update_reservation_response'}]

  delete_reservation:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: delete_reservation
    x-acesso: dono-ou-admin
    summary: Cancela uma reserva e libera a sala.
    description: |
      - Libera a sala imediatamente (equivale a liberá-la antecipadamente).
      - Usuário comum cancela apenas as próprias reservas; o admin cancela qualquer uma.
      - Reserva já encerrada → 409.
    tags: [{$ref: '#/components/tags/reservas'}]
    messages: [{$ref: '#/channels/conexao/messages/delete_reservation'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/delete_reservation_response'}]

  # ───────────────────────────── Protocolo ────────────────────────────────
  linha_invalida:
    action: receive
    channel: {$ref: '#/channels/conexao'}
    title: linha inválida
    x-acesso: publico
    summary: Qualquer linha fora do protocolo recebe `error` com status 400.
    description: |
      - JSON inválido → "Requisicao invalida".
      - `op` desconhecida → "Operacao desconhecida".
      - Mais de 8192 bytes (incluindo o `\n`) → "Mensagem excede o tamanho maximo".
      - Como a `op` original não pôde ser determinada, a resposta usa `"op": "error"` em vez de `<op>_response`.
    tags: [{$ref: '#/components/tags/protocolo'}]
    messages: [{$ref: '#/channels/conexao/messages/linha_invalida'}]
    reply:
      channel: {$ref: '#/channels/conexao'}
      messages: [{$ref: '#/channels/conexao/messages/error'}]

components:
  tags:
    autenticacao:
      name: Autenticação
      description: register, login e logout.
    usuario:
      name: Próprio cadastro
      description: CRUD do próprio cadastro. O token identifica o autor.
    admin:
      name: Administrador
      description: Operações admin_*. Exigem token de role "admin".
    salas:
      name: Salas
      description: CRUD de salas. Criar, alterar e remover exigem admin; ler e listar são liberados a qualquer usuário logado.
    reservas:
      name: Reservas
      description: CRUD de reservas. O dono da reserva é identificado pelo token.
    protocolo:
      name: Protocolo
      description: Erros de framing e de parse.

  messages:
    # ─────────────────────────── Autenticação ───────────────────────────
    register:
      name: register
      summary: 'C → S · cria uma conta (sem token)'
      payload:
        type: object
        required: [op, email, user, password]
        properties:
          op: {type: string, const: register}
          email: {$ref: '#/components/schemas/email'}
          user: {$ref: '#/components/schemas/user'}
          password: {$ref: '#/components/schemas/password'}
      examples:
        - name: requisicao
          payload: {"op": "register", "email": "joao.silva@email.com", "user": "joao", "password": "senha123"}
        - name: email institucional (.edu.br)
          payload: {"op": "register", "email": "maria.souza@alunos.utfpr.edu.br", "user": "maria", "password": "senha123"}

    register_response:
      name: register_response
      summary: 'S → C · resposta ao register'
      payload:
        type: object
        required: [op, status, message]
        properties:
          op: {type: string, const: register_response}
          status: {$ref: '#/components/schemas/status'}
          message: {$ref: '#/components/schemas/message'}
        oneOf:
          - title: '201 · Usuario cadastrado com sucesso'
            type: object
            properties:
              status: {const: '201'}
              message: {const: Usuario cadastrado com sucesso}
          - $ref: '#/components/schemas/E400_cadastro'
          - $ref: '#/components/schemas/E409_cadastrado'
          - $ref: '#/components/schemas/E500'
      examples:
        - name: '201'
          payload: {"op": "register_response", "status": "201", "message": "Usuario cadastrado com sucesso"}
        - name: '400'
          payload: {"op": "register_response", "status": "400", "message": "Dados de cadastro em formato invalido"}
        - name: '409'
          payload: {"op": "register_response", "status": "409", "message": "Usuario ou email ja cadastrado"}

    login:
      name: login
      summary: 'C → S · autentica por email e senha (sem token)'
      payload:
        type: object
        required: [op, email, password]
        properties:
          op: {type: string, const: login}
          email: {$ref: '#/components/schemas/email'}
          password: {$ref: '#/components/schemas/password'}
      examples:
        - name: requisicao
          payload: {"op": "login", "email": "joao.silva@email.com", "password": "senha123"}

    login_response:
      name: login_response
      summary: 'S → C · resposta ao login'
      payload:
        type: object
        required: [op, status, message]
        properties:
          op: {type: string, const: login_response}
          status: {$ref: '#/components/schemas/status'}
          message: {$ref: '#/components/schemas/message'}
        oneOf:
          - title: '200 · Login realizado com sucesso'
            type: object
            required: [token, role]
            properties:
              status: {const: '200'}
              message: {const: Login realizado com sucesso}
              token: {$ref: '#/components/schemas/token'}
              role: {$ref: '#/components/schemas/role'}
          - $ref: '#/components/schemas/E400_credenciais'
          - $ref: '#/components/schemas/E401_credenciais'
          - $ref: '#/components/schemas/E409_sessao_ativa'
          - $ref: '#/components/schemas/E500'
      examples:
        - name: '200'
          payload: {"op": "login_response", "status": "200", "message": "Login realizado com sucesso", "token": "c0fc3c713f09a43384ac08f7d91fca430dcbc6466fff9284ce4571bdc2c8f9f9", "role": "user"}
        - name: '400'
          payload: {"op": "login_response", "status": "400", "message": "Email ou senha em formato invalido"}
        - name: '401'
          payload: {"op": "login_response", "status": "401", "message": "Email ou senha incorretos"}
        - name: '409'
          payload: {"op": "login_response", "status": "409", "message": "Usuario ja possui sessao ativa"}

    logout:
      name: logout
      summary: 'C → S · encerra a sessão'
      payload:
        type: object
        required: [op, token]
        properties:
          op: {type: string, const: logout}
          token: {$ref: '#/components/schemas/token'}
      examples:
        - name: requisicao
          payload: {"op": "logout", "token": "c0fc3c713f09a43384ac08f7d91fca430dcbc6466fff9284ce4571bdc2c8f9f9"}

    logout_response:
      name: logout_response
      summary: 'S → C · resposta ao logout'
      payload:
        type: object
        required: [op, status, message]
        properties:
          op: {type: string, const: logout_response}
          status: {$ref: '#/components/schemas/status'}
          message: {$ref: '#/components/schemas/message'}
        oneOf:
          - title: '200 · Logout realizado com sucesso'
            type: object
            properties:
              status: {const: '200'}
              message: {const: Logout realizado com sucesso}
          - $ref: '#/components/schemas/E400_token'
          - $ref: '#/components/schemas/E401_token'
          - $ref: '#/components/schemas/E500'
      examples:
        - name: '200'
          payload: {"op": "logout_response", "status": "200", "message": "Logout realizado com sucesso"}
        - name: '400'
          payload: {"op": "logout_response", "status": "400", "message": "Token em formato invalido"}
        - name: '401'
          payload: {"op": "logout_response", "status": "401", "message": "Token invalido ou expirado"}

    # ───────────────────────── Próprio cadastro ─────────────────────────
    read_user:
      name: read_user
      summary: 'C → S · lê o próprio cadastro'
      payload:
        type: object
        required: [op, token]
        properties:
          op: {type: string, const: read_user}
          token: {$ref: '#/components/schemas/token'}
      examples:
        - name: requisicao
          payload: {"op": "read_user", "token": "c0fc3c713f09a43384ac08f7d91fca430dcbc6466fff9284ce4571bdc2c8f9f9"}

    read_user_response:
      name: read_user_response
      summary: 'S → C · resposta ao read_user'
      payload:
        type: object
        required: [op, status, message]
        properties:
          op: {type: string, const: read_user_response}
          status: {$ref: '#/components/schemas/status'}
          message: {$ref: '#/components/schemas/message'}
        oneOf:
          - title: '200 · Consulta realizada com sucesso'
            type: object
            required: [user, email, role, created_at]
            properties:
              status: {const: '200'}
              message: {const: Consulta realizada com sucesso}
              user: {$ref: '#/components/schemas/user'}
              email: {$ref: '#/components/schemas/email'}
              role: {$ref: '#/components/schemas/role'}
              created_at: {$ref: '#/components/schemas/created_at'}
          - $ref: '#/components/schemas/E400_token'
          - $ref: '#/components/schemas/E401_token'
          - $ref: '#/components/schemas/E500'
      examples:
        - name: '200'
          payload: {"op": "read_user_response", "status": "200", "message": "Consulta realizada com sucesso", "user": "joao", "email": "joao.silva@email.com", "role": "user", "created_at": "2026-09-09 14:32:10"}
        - name: '400'
          payload: {"op": "read_user_response", "status": "400", "message": "Token em formato invalido"}
        - name: '401'
          payload: {"op": "read_user_response", "status": "401", "message": "Token invalido ou expirado"}

    update_user:
      name: update_user
      summary: 'C → S · altera o próprio cadastro'
      payload:
        type: object
        description: 'Campo "" = não alterar, mas pelo menos um precisa mudar (regra 2.13). A chave `email` é proibida (RNF 5.c) e resulta em 400.'
        required: [op, token, user, password]
        properties:
          op: {type: string, const: update_user}
          token: {$ref: '#/components/schemas/token'}
          user:
            description: Novo nome de usuário, ou "" para manter.
            anyOf:
              - $ref: '#/components/schemas/user'
              - $ref: '#/components/schemas/nao_alterar'
          password:
            description: Nova senha, ou "" para manter.
            anyOf:
              - $ref: '#/components/schemas/password'
              - $ref: '#/components/schemas/nao_alterar'
        allOf:
          - not:
              description: 'A chave `email` não pode ser enviada: o e-mail não muda depois do cadastro (RNF 5.c).'
              required: [email]
          - not:
              description: '`user` e `password` vazios ao mesmo tempo: não há nada para atualizar (regra 2.13).'
              x-message: Nenhum dado para atualizar
              required: [user, password]
              properties: {user: {const: ''}, password: {const: ''}}
      examples:
        - name: requisicao
          payload: {"op": "update_user", "token": "c0fc3c713f09a43384ac08f7d91fca430dcbc6466fff9284ce4571bdc2c8f9f9", "user": "joao", "password": "novasenha1"}

    update_user_response:
      name: update_user_response
      summary: 'S → C · resposta ao update_user'
      payload:
        type: object
        required: [op, status, message]
        properties:
          op: {type: string, const: update_user_response}
          status: {$ref: '#/components/schemas/status'}
          message: {$ref: '#/components/schemas/message'}
        oneOf:
          - title: '200 · Dados atualizados com sucesso'
            type: object
            properties:
              status: {const: '200'}
              message: {const: Dados atualizados com sucesso}
          - $ref: '#/components/schemas/E400_dados'
          - $ref: '#/components/schemas/E400_nada_para_atualizar'
          - $ref: '#/components/schemas/E401_token'
          - $ref: '#/components/schemas/E409_usuario_em_uso'
          - $ref: '#/components/schemas/E500'
      examples:
        - name: '200'
          payload: {"op": "update_user_response", "status": "200", "message": "Dados atualizados com sucesso"}
        - name: '400'
