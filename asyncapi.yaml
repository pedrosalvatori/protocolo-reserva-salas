    # ───────────────────────────── Protocolo ────────────────────────────
    linha_invalida:
      name: linha_invalida
      summary: 'C → S · qualquer linha que não é uma requisição reconhecível'
      contentType: text/plain
      payload:
        type: string
        description: JSON malformado, `op` desconhecida ou linha com mais de 8192 bytes (incluindo o `\n`).
      examples:
        - name: JSON malformado
          payload: '{"op": "login", "email": '
        - name: op desconhecida
          payload: '{"op": "reservar_tudo", "token": "c0fc3c713f09a43384ac08f7d91fca430dcbc6466fff9284ce4571bdc2c8f9f9"}'

    error:
      name: error
      summary: 'S → C · erro de protocolo (a op original não pôde ser determinada)'
      payload:
        type: object
        required: [op, status, message]
        properties:
          op: {type: string, const: error}
          status: {type: string, const: '400'}
          message:
            type: string
            enum:
              - Requisicao invalida
              - Operacao desconhecida
              - Mensagem excede o tamanho maximo
      examples:
        - name: JSON invalido
          payload: {"op": "error", "status": "400", "message": "Requisicao invalida"}
        - name: op desconhecida
          payload: {"op": "error", "status": "400", "message": "Operacao desconhecida"}
        - name: acima de 8192 bytes
          payload: {"op": "error", "status": "400", "message": "Mensagem excede o tamanho maximo"}

  schemas:
    # ─────────────── Dicionário de campos (todos os valores são strings) ───────────────
    op:
      type: string
      pattern: '^[a-z_]{3,30}$'
      description: 'Operação. Na resposta: op da requisição + "_response"; "error" em falha de parse.'
      examples: [login, login_response]
    status:
      type: string
      pattern: '^[0-9]{3}$'
      description: Código numérico da resposta, como string.
      examples: ['200']
    message:
      type: string
      description: Texto em português, sem acentos e sem emojis, exatamente como definido em cada operação.
      examples: [Login realizado com sucesso]
    token:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: Gerado no login (64 hex minúsculos), invalidado no logout. Obrigatório em toda requisição, exceto register e login.
      examples: [c0fc3c713f09a43384ac08f7d91fca430dcbc6466fff9284ce4571bdc2c8f9f9]
    user:
      type: string
      pattern: '^[a-z]{1,30}$'
      description: 'Nome de usuário: só letras minúsculas; sem números, espaços, acentos, especiais ou emojis. Único no sistema.'
      examples: [joao]
    password:
      type: string
      pattern: '^[A-Za-z0-9]{1,20}$'
      description: Somente letras e números. Nunca aparece em resposta.
      examples: [senha123]
    email:
      type: string
      pattern: '^[a-z0-9._-]+@[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$'
      description: 'Único no sistema. Aceita domínios com vários níveis e hífen (.com.br, .edu.br, alunos.utfpr.edu.br) e "_" ou "-" antes do @ (v2.1). Definido no register e não pode ser alterado depois (RNF 5.c).'
      examples: [joao.silva@email.com, maria.souza@alunos.utfpr.edu.br]
    role:
      type: string
      enum: [user, admin]
      description: 'Todo register nasce "user". Somente admin altera role.'
    target_user:
      type: string
      pattern: '^[a-z]{1,30}$'
      description: Usuário ALVO de uma operação admin_*. Nunca identifica o autor da requisição.
      examples: [maria]
    room_id:
      type: string
      pattern: '^[0-9]{1,10}$'
      description: Gerado pelo servidor no create_room. Imutável.
      examples: ['1']
    name:
      type: string
      pattern: '^[A-Za-z0-9 -]{1,30}$'
      description: Nome da sala, único, sem acentos.
      examples: [Sala de Estudo B12]
    capacity:
      type: string
      pattern: '^[1-9][0-9]{0,3}$'
      description: Número de lugares, como string. Limita participants das reservas.
      examples: ['12']
    location:
      type: string
      pattern: '^[A-Za-z0-9 ,.-]{1,60}$'
      description: Localização física da sala.
      examples: [Bloco B - 1 andar]
    resources:
      type: array
      items: {type: string}
      description: Lista de recursos da sala. Array vazio quando não houver.
      examples: [[projetor, tv]]
    room_status:
      type: string
      enum: [active, inactive]
      description: '"inactive" (manutenção) não aceita novas reservas. Nome distinto de status para não colidir com o código da resposta.'
    reservation_id:
      type: string
      pattern: '^[0-9]{1,10}$'
      description: Gerado pelo servidor no create_reservation. Imutável.
      examples: ['27']
    date:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      description: Formato ISO AAAA-MM-DD. Não se reserva data passada (400).
      examples: ['2026-09-15']
    start_time:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Hora local do servidor (America/Sao_Paulo), 24 h.
      examples: ['14:00']
    end_time:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Deve ser maior que start_time e no mesmo dia (400 caso contrário).
      examples: ['16:00']
    topic:
      type: string
      pattern: '^[A-Za-z0-9 ,.-]{1,60}$'
      description: Assunto da reserva, sem acentos.
      examples: [Reuniao de projeto]
    participants:
      type: string
      pattern: '^[1-9][0-9]{0,3}$'
      description: Não pode exceder a capacity da sala (400).
      examples: ['6']
    available:
      type: string
      enum: ['true', 'false']
      description: Booleano como string. Informativo, não reserva a sala.
    count:
      type: string
      pattern: '^[0-9]{1,10}$'
      description: Quantidade de itens no array devolvido.
      examples: ['3']
    created_at:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
      description: Data e hora local do servidor.
      examples: ['2026-09-09 14:32:10']
    scope:
      type: string
      enum: [mine, all]
      default: mine
      description: '"mine" (padrão) ou "all" (só admin). ⚠ Não consta no Dicionário da planilha.'
    min_capacity:
      type: string
      pattern: '^[1-9][0-9]{0,3}$'
      description: Filtro de capacidade mínima. ⚠ Não consta no Dicionário; assumido o formato de capacity.
      examples: ['6']
    nao_alterar:
      title: '"" (não alterar)'
      type: string
      const: ''
      description: Em requisições de atualização, string vazia mantém o valor atual (regra 2.11).

    # ─────────────── Registros devolvidos em listagens ───────────────
    Usuario:
      title: Usuário
      type: object
      description: Item de `users` (admin_list_users). Nunca contém senha.
      required: [user, email, role]
      properties:
        user: {$ref: '#/components/schemas/user'}
        email: {$ref: '#/components/schemas/email'}
        role: {$ref: '#/components/schemas/role'}
    Sala:
      title: Sala
      type: object
      description: Item de `rooms` (list_rooms). `available` só aparece quando date, start_time e end_time são enviados.
      required: [room_id, name, capacity, location, resources, room_status]
      properties:
        room_id: {$ref: '#/components/schemas/room_id'}
        name: {$ref: '#/components/schemas/name'}
        capacity: {$ref: '#/components/schemas/capacity'}
        location: {$ref: '#/components/schemas/location'}
        resources: {$ref: '#/components/schemas/resources'}
        room_status: {$ref: '#/components/schemas/room_status'}
        available: {$ref: '#/components/schemas/available'}
    Reserva:
      title: Reserva
      type: object
      description: Item de `reservations` (list_reservations). `name` é o nome da sala; `user` é o dono.
      required: [reservation_id, room_id, name, user, date, start_time, end_time, topic, participants]
      properties:
        reservation_id: {$ref: '#/components/schemas/reservation_id'}
        room_id: {$ref: '#/components/schemas/room_id'}
        name: {$ref: '#/components/schemas/name'}
        user: {$ref: '#/components/schemas/user'}
        date: {$ref: '#/components/schemas/date'}
        start_time: {$ref: '#/components/schemas/start_time'}
        end_time: {$ref: '#/components/schemas/end_time'}
        topic: {$ref: '#/components/schemas/topic'}
        participants: {$ref: '#/components/schemas/participants'}

