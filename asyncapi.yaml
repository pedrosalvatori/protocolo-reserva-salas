asyncapi: 3.0.0
id: 'urn:br:edu:utfpr:pg:sd:reserva-salas'

info:
  title: Reserva de Salas · Protocolo de Mensagens
  version: 2.4.0
  description: |
    Protocolo cliente/servidor do **Sistema Inteligente de Reserva de Salas de Reunião/Estudo em Campus**
    (Sistemas Distribuídosprotocolo-mermaid.md · BCC · UTFPR-PG · Prof. Dr. Richard Ribeiro).
    Responsáveis pelo protocolo: Pedro Silveira e Daniel Jesus.

    Este documento descreve o **servidor**: cada operação é uma mensagem que ele **recebe** do cliente (C → S)
    e a **resposta** que devolve (S → C) na mesma conexão. Reconstruído a partir da planilha
    *Protocolo de troca de Mensagens* v2.0.

    ## 1. Transporte e formato

    | # | Regra | Valor |
    |---|---|---|
    | 1.1 | Arquitetura | Cliente/servidor com troca de mensagens via sockets. Uma thread por conexão. |
    | 1.2 | Transporte | TCP. O servidor tem campo para a porta de escuta; o cliente, campos para IP e porta. |
    | 1.3 | Codificação | UTF-8 nos dois lados. |
    | 1.4 | Formato | 1 mensagem = 1 objeto JSON em **linha única** (sem quebras de linha internas, sem indentação). |
    | 1.5 | Framing | Toda mensagem termina com LF (`\n`). O receptor lê até o `\n`. |
    | 1.6 | Tamanho máximo | 8192 bytes, já incluindo o `\n`. Acima disso a mensagem é descartada e respondida com 400. |
    | 1.7 | Interação | Requisição/resposta: toda requisição gera **exatamente uma** resposta, na mesma conexão. |
    | 1.8 | Nome da resposta | `op` da resposta = `op` da requisição + `_response` (ex.: `login` → `login_response`). |
    | 1.9 | Conexão | Mantida durante a sessão. Com 300 s de inatividade o servidor fecha a conexão, mas **não** invalida o token. |
    | 1.10 | Ordem dos campos | Irrelevante: o receptor nunca depende da ordem das chaves. |
    | 1.11 | Reconexão (v2.2) | Se a conexão caiu ou foi fechada por inatividade, o cliente abre outra e reenvia a requisição com o mesmo token. Requisição sem resposta não conta como concluída. |

    ## 2. Regras das chaves

    - **2.1** Toda mensagem (requisição e resposta) tem `op`; o emissor a escreve como primeira chave.
    - **2.2** Chaves em inglês, `snake_case`, minúsculas, sem acentos. `op` e nomes de chaves são case-sensitive (2.12).
    - **2.3** **Todos os valores são strings**, inclusive números, booleanos e datas (`"capacity": "12"`, `"available": "true"`).
    - **2.4** Listas são arrays JSON de objetos cujos valores também são strings (`"rooms": [ {…}, {…} ]`).
    - **2.5** Toda requisição envia `token`, exceto `register` e `login`.
    - **2.6 / 2.7** Toda resposta tem no mínimo `op`, `status` e `message`; `status` é o código numérico como string (`"200"`).
    - **2.8** `message` em português, sem acentos e sem emojis, **exatamente** como definido em cada operação.
    - **2.9** Campos desconhecidos são ignorados (interoperabilidade entre grupos).
    - **2.10** Campo obrigatório ausente, `null` ou de tipo diferente de string → 400.
    - **2.11** `""` em atualização significa **não alterar**; em criação é inválido (400).
    - **2.13** (v2.4) Atualizar um usuário exige mudar pelo menos um campo: `update_user` com `user` e `password` vazios,
      ou `admin_update_user` com `user`, `password` e `role` vazios, responde **400 "Nenhum dado para atualizar"**.
    - **2.12** `user` e `email` são sempre gravados em minúsculas.

    ## 3. Autenticação, token e perfis

    - **3.1** O token é gerado no login: 64 caracteres hexadecimais minúsculos (`^[a-f0-9]{64}$`).
    - **3.2** O servidor grava o token no banco, associado ao usuário; o cliente o guarda em memória durante a sessão.
    - **3.3** Validade: 30 min sem uso; cada requisição válida renova a contagem. Token expirado → 401.
    - **3.4** O logout invalida o token; um token invalidado nunca é reutilizado.
    - **3.5** Sessão única: novo login com sessão ativa → 409.
    - **3.6** Perfis (`role`): `user` e `admin`. Todo `register` nasce `user`.
    - **3.7** Operações `admin_*` e criar/alterar/remover sala exigem `admin`. Token válido sem permissão → 403.
    - **3.8** O autor é identificado **pelo token**; o cliente nunca envia o próprio `user` para dizer quem é.
    - **3.9** (v2.1) **401 significa que o servidor não tem sessão ativa para aquele token** (ausente, inválido,
      expirado ou invalidado) ou, no `login`, que as credenciais estão erradas. Por isso o cliente pode descartar
      o token ao receber 401. Senha de confirmação errada com token válido (`delete_user`) responde **403**, e a sessão continua.
    - **3.10** (v2.2) **Logout só termina com resposta.** O cliente só descarta o token depois de receber o `logout_response`
      (200, ou 401 se o token já não valia). Se a conexão tiver caído, reconecta e reenvia o logout (regra 1.11).
    - **3.11** (v2.2) **Sessão única sem corrida.** Verificar se há sessão ativa e criar o token acontecem na mesma seção
      crítica (lock por usuário ou restrição UNIQUE de sessão por usuário no banco). Com dois logins simultâneos corretos,
      um recebe 200 e o outro 409.
    - **3.12** (v2.2) **Ordem fixa no login:** formato (400) → credenciais (401) → sessão ativa (409). O 409 só aparece com
      email e senha corretos, para não revelar quais contas existem ou estão online.
    - **3.13** (v2.3) **Remover uma conta apaga tudo dela.** `delete_user` e `admin_delete_user` apagam o cadastro, encerram a
      sessão e apagam **todas** as reservas do usuário (passadas e futuras). O `user` e o `email` ficam livres: um novo
      `register` com os mesmos dados responde 201. Assim ninguém herda reservas ou histórico de uma conta removida.

    Cada operação indica o nível de acesso na extensão `x-acesso`: `publico` (sem token), `logado`,
    `admin`, `dono` (dono da reserva) ou `dono-ou-admin`.

    ## 4. Erros e ordem de validação

    Linha acima do limite, JSON inválido ou `op` desconhecida → resposta `error` (ver operação **linha_invalida**).
    Qualquer operação pode responder **500**: `{"op": "<op>_response", "status": "500", "message": "Erro interno do servidor"}`.
    O servidor nunca fecha a conexão sem responder a uma requisição recebida por completo.

    Ordem sugerida de validação (a planilha não fixa a precedência, ver pendência 6):
    tamanho → JSON → `op` → campos e regex (400) → token (401) → permissão (403) → existência (404) → conflito (409) → executa (200/201).
    No `login` a ordem é obrigatória desde a v2.2 (regra 3.12).

    ## 5. Concorrência

    - **5.1** Verificar a disponibilidade e gravar a reserva acontecem na **mesma seção crítica**, com lock por `room_id`.
    - **5.2** `check_availability` é informativo: `"true"` não reserva nada nem garante a reserva seguinte.
    - **5.3** Dois clientes reservando a mesma sala e horário: o primeiro a obter o lock recebe 201; o segundo, 409.
    - **5.4** Há conflito quando `novo_inicio < fim_existente` **e** `novo_fim > inicio_existente`. Encostar (começar exatamente no fim de outra) **não** é conflito.

    ## 6. Códigos de status

    | status | Significado | Quando o servidor usa | Como o cliente reage |
    |---|---|---|---|
    | 200 | OK | Sucesso em leitura, atualização, remoção, login e logout. | Segue o fluxo e atualiza a tela. |
    | 201 | Created | Recurso criado: `register`, `create_room`, `create_reservation`. | Confirma e guarda o id devolvido. |
    | 400 | Bad Request | Campo ausente, nulo, tipo inválido, regex reprovada, JSON inválido, mensagem acima do limite. | Mostra o erro e mantém o formulário preenchido. |
    | 401 | Unauthorized | Token ausente, inválido, expirado ou invalidado (o servidor não tem sessão ativa para ele); no `login`, credenciais incorretas. | Descarta o token e volta ao login. |
    | 403 | Forbidden | Token válido, mas a ação não é permitida: usuário comum em op de admin, reserva de terceiro, último admin, senha de confirmação incorreta. | Informa o motivo e mantém a sessão; não repete. |
    | 404 | Not Found | Usuário alvo, sala ou reserva inexistente. | Informa e recarrega a listagem. |
    | 409 | Conflict | Já cadastrado, sessão ativa, horário reservado, sala com reservas ativas. | Mostra o conflito e oferece alternativa. |
    | 500 | Internal Server Error | Falha inesperada no servidor. | Informa e permite nova tentativa; não descarta o token. |

    ## 7. Pendências encontradas ao modelar

    1. **Token ausente**: a regra 2.10 manda responder 400 (campo obrigatório ausente), mas a aba *Códigos de Status* lista "token ausente" como 401.
    2. **Resolvida na v2.1.** `delete_user` com senha incorreta respondia 401 sem `message` definida e fazia o cliente descartar um token que o servidor mantinha ativo. Agora responde 403 "Senha incorreta" (regra 3.9).
    3. **`update_room` reduzindo `capacity`** abaixo dos `participants` de uma reserva futura responde 409, sem `message` definida.
    4. **`scope` e `min_capacity`** aparecem nas mensagens, mas não no Dicionário. Aqui: `scope` ∈ {mine, all}; `min_capacity` no formato de `capacity`.
    5. **`resources` em atualização**: a regra 2.11 (`""` = não alterar) não cobre arrays. `[]` esvazia a lista ou mantém?
    6. **Precedência de erros** não definida (ex.: usuário comum enviando `create_room` inválido recebe 400 ou 403?). Importa para testes entre grupos.
    7. **Sessão presa**: se o cliente perder o token sem fazer logout (app fechado, travamento), um novo login responde 409 por até 30 min, e o logout exige o token perdido. A v2.1 tirou dessa lista a senha de confirmação errada (regra 3.9) e a v2.2 o logout depois de inatividade (regras 1.11 e 3.10); o caso do app fechado continua em aberto.
    8. **Maiúsculas**: a regra 2.12 diz que `user`/`email` são gravados em minúsculas, mas as regex rejeitam maiúsculas. Converter ou responder 400?
    9. **Estados de sala**: uma nota na aba *Msg Salas* cita "fechada para limpeza, ocupado", mas `room_status` só aceita `active`/`inactive`.
    10. **`update_reservation` pelo admin**: `read_reservation` e `delete_reservation` dizem que o admin age sobre qualquer reserva; `update_reservation` não diz. Aqui ficou `x-acesso: dono`.

    ## 8. Histórico de versões

    - **2.4.0**
      - `update_user` com `user` e `password` vazios, ou `admin_update_user` com `user`, `password` e `role` vazios, respondia
        200 "Dados atualizados com sucesso" sem mudar nada. Agora responde **400 "Nenhum dado para atualizar"** (regra 2.13).
    - **2.3.0** (remoção de conta; nenhuma mensagem mudou)
      - `delete_user` e `admin_delete_user` apagam o cadastro, a sessão e todas as reservas do usuário; o `user` e o `email`
        ficam livres para um novo cadastro (regra 3.13). Antes só as reservas futuras eram canceladas, e um novo cadastro
        com o mesmo `user` podia herdar as reservas antigas.
      - Testador automático do servidor: `node scripts/testar-servidor.mjs` (ver README).
    - **2.2.0** (sessão e login; nenhuma mensagem mudou, só regras)
      - Logout depois de inatividade: o cliente reconecta e reenvia, e só descarta o token com o `logout_response` (regras 1.11 e 3.10).
      - Login simultâneo não cria duas sessões: checar e criar a sessão na mesma seção crítica (regra 3.11).
      - Ordem fixa no login, 400 → 401 → 409, para o 409 não revelar contas (regra 3.12).
    - **2.1.0**
      - `email` aceita domínios com vários níveis e com hífen (`.com.br`, `.edu.br`, `alunos.utfpr.edu.br`, `meu-provedor.com.br`)
        e `_` ou `-` antes do `@`. A terminação do domínio passa a exigir 2 letras ou mais.
        Todo e-mail válido na 2.0 continua válido, exceto os com terminação de 1 letra.
      - `delete_user` com senha incorreta: de 401 para **403 "Senha incorreta"**, sem derrubar a sessão (regra 3.9).
    - **2.0.0**: versão da planilha *Protocolo de troca de Mensagens*.
  x-novidades:
    versao: 2.4.0
    data: 07/10/2026
    titulo: Ajustes no protocolo (versões 2.1 a 2.4)
    itens:
      - '**E-mail (2.1):** aceita `.com.br`, `.edu.br` e domínios com vários níveis, como `alunos.utfpr.edu.br`, além de hífen no domínio e `_` antes do @.'
      - '**Senha errada no `delete_user` (2.1):** responde **403 "Senha incorreta"** e a sessão continua. Antes era 401, que fazia o cliente sair sem o servidor encerrar o token, e o login seguinte ficava bloqueado (409) por até 30 min.'
      - '**Logout depois de 5 min parado (2.2):** a conexão pode ter sido fechada por inatividade. O cliente reconecta, reenvia o logout e só descarta o token quando recebe a resposta.'
      - '**Login simultâneo (2.2):** checar a sessão e criar o token na mesma seção crítica. Dois logins ao mesmo tempo na mesma conta: um recebe 200 e o outro 409.'
      - '**Ordem no login (2.2):** formato (400) → senha (401) → sessão ativa (409). O 409 só aparece com a senha certa, para não revelar quais contas existem.'
      - '**Remover a conta (2.3):** `delete_user` e `admin_delete_user` apagam o cadastro, a sessão e todas as reservas do usuário. O `user` e o `email` ficam livres para outra pessoa se cadastrar com os mesmos dados.'
      - '**Alterar usuário sem mudar nada (2.4):** `update_user` com `user` e `password` vazios (ou `admin_update_user` com os três campos vazios) responde **400 "Nenhum dado para atualizar"**, e não mais 200.'
      - '**Testador automático (novo):** `node scripts/testar-servidor.mjs IP PORTA` roda mais de 70 testes contra o servidor de vocês e aponta o que está fora do contrato. Veja o README.'
    o_que_mudar:
      - '**Cliente e servidor:** trocar a regex de e-mail.'
      - '**Servidor:** 403 "Senha incorreta" no `delete_user`; validar o login na ordem 400 → 401 → 409; checar e criar a sessão sob o mesmo lock; ao remover uma conta, apagar cadastro, sessão e todas as reservas; responder 400 "Nenhum dado para atualizar" quando a alteração de usuário vier toda vazia.'
      - '**Cliente:** tratar o 403 do `delete_user` sem descartar o token; reconectar e reenviar quando o socket estiver fechado; só descartar o token depois do `logout_response`.'
